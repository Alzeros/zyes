<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- theme-color drives the mobile browser chrome (status bar / PWA title
         bar) so it matches the page surface instead of defaulting to white. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f6f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1117" />
    <title>zyes</title>
    <!-- Favicon matches the in-app Z wordmark (sharp miter Z) instead of a
         serif text-glyph "Z". -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='6 5 17 22'%3E%3Cpath d='M 9 8 H 22 L 10 24 H 23' stroke='%231e293b' stroke-width='3' stroke-linejoin='miter' stroke-linecap='square' fill='none'/%3E%3C/svg%3E" />
    <!-- PWA: installable to the home screen (manifest + icons); sw.js is
         registered from main.ts in production builds only. The apple-* metas
         cover iOS versions that predate manifest `display` support. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="zyes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="antialiased">
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
